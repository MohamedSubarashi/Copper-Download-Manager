name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-windows:
    name: Build (Windows / Qt ${{ matrix.qt }} / ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Note: versions here must be ones aqtinstall can actually fetch from the
        # official open-source Qt mirror. Qt 6.11.2 (used on the local dev machine)
        # is NOT published there yet, so it is covered only locally; 6.8.3 is the
        # current LTS and is guaranteed available.
        qt: ["6.6.3", "6.8.3"]
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt + MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          arch: win64_mingw
          cache: true
          # The Qt mingw_64 binary packages are built with GCC 13. windows-latest
          # only ships GCC 15.2 (C:\mingw64), which fails to link
          # libQt6EntryPoint.a ("undefined reference to __imp___argc"). Install the
          # matching MinGW 13.1 tool and prepend it to PATH so CMake uses it.
          tools: 'tools_mingw,qt.tools.win64_mingw1310'
          add-tools-to-path: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Packaging smoke check (Release only)
        if: matrix.config == 'Release'
        shell: bash
        run: |
          test -f build/CopperDownloadManager.exe && echo "exe built OK"
          # Confirm PE subsystem is GUI (no console window): 2 = GUI
          python - <<'PY'
          import struct
          exe = "build/CopperDownloadManager.exe"
          with open(exe, "rb") as f:
              data = f.read()
          pe_off = struct.unpack_from("<I", data, 0x3C)[0]
          subsystem = struct.unpack_from("<H", data, pe_off + 0x5C)[0]
          print("PE subsystem =", subsystem, "(GUI)" if subsystem == 2 else "(CONSOLE)")
          assert subsystem == 2, "expected GUI subsystem, got console"
          PY
          echo "Deployed package:"
          ls -la installer/release/0.3.5/ 2>/dev/null | head -40 || true
