name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  extension-lint:
    name: Extension manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Chrome/Firefox manifests
        run: python tests/validate_extensions.py

  build-windows:
    name: Build (Windows / Qt ${{ matrix.qt }} / ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions here must (a) be fetchable by aqtinstall from the official
        # open-source Qt mirror, and (b) link against the MinGW that windows-latest
        # ships out of the box (GCC 15.2 in C:\mingw64). Qt 6.8.x mingw_64 binaries
        # are built with GCC 13 and fail to link there (libQt6EntryPoint.a:
        # "undefined reference to __imp___argc"); Qt 6.6.3 is ABI-compatible and
        # green. Qt 6.11.2 (used on the local dev machine) is not published on the
        # mirror, so it is covered only locally.
        qt: ["6.6.3"]
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          arch: win64_mingw
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Packaging smoke check (Release only)
        if: matrix.config == 'Release'
        shell: bash
        run: |
          test -f build/CopperDownloadManager.exe && echo "exe built OK"
          # Confirm PE subsystem is GUI (no console window): 2 = GUI
          python - <<'PY'
          import struct
          exe = "build/CopperDownloadManager.exe"
          with open(exe, "rb") as f:
              data = f.read()
          pe_off = struct.unpack_from("<I", data, 0x3C)[0]
          subsystem = struct.unpack_from("<H", data, pe_off + 0x5C)[0]
          print("PE subsystem =", subsystem, "(GUI)" if subsystem == 2 else "(CONSOLE)")
          assert subsystem == 2, "expected GUI subsystem, got console"
          PY
          echo "Deployed package:"
          ls -la installer/release/0.5.6/ 2>/dev/null | head -40 || true

      - name: Package portable zip (Release only)
        if: matrix.config == 'Release'
        shell: bash
        run: |
          VER="$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          echo "Packaging version ${VER}"
          python - "$VER" <<'PY'
          import sys
          import zipfile
          import os
          ver = sys.argv[1]
          src = f"installer/release/{ver}"
          out = f"installer/release/CopperDownloadManager-portable-{ver}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(src):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, src))
          print("created", out)
          PY

      - name: Upload portable artifact (Release only)
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: copper-download-manager-portable-${{ matrix.qt }}
          path: installer/release/CopperDownloadManager-portable-*.zip

  build-linux-deb:
    name: Build Linux .deb (Ubuntu / Qt 6.6.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Package .deb
        run: |
          cpack -B build --config build/CPackConfig.cmake -G DEB
          ls -la build/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: copper-download-manager-deb
          path: build/*.deb

  build-arch:
    name: Build Arch .pkg.tar.zst
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain + deps
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake ninja qt6-base \
            aria2 yt-dlp ffmpeg git
      - uses: actions/checkout@v4

      - name: Create PKGBUILD source tarball and build
        run: |
          VER="$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          echo "VER=$VER"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd installer/arch
          git archive --format=tar.gz \
            --prefix="Copper-Download-Manager-${VER}/" \
            -o "copper-download-manager-${VER}.tar.gz" HEAD
          chown builder:builder "copper-download-manager-${VER}.tar.gz"
          su builder -c "cd '$GITHUB_WORKSPACE/installer/arch' && makepkg -f --noconfirm"
          ls -la *.pkg.tar.zst

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: copper-download-manager-arch
          path: installer/arch/*.pkg.tar.zst

  build-macos:
    name: Build macOS .dmg (Qt 6.6.3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Deploy Qt libs into .app bundle
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" \
            build/CopperDownloadManager.app \
            -dmg -always-overwrite || \
          "$QT_ROOT_DIR/bin/macdeployqt" \
            build/CopperDownloadManager.app -always-overwrite
          ls -la build/*.dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: copper-download-manager-dmg
          path: build/*.dmg

  release:
    name: Publish GitHub release
    needs: [build-linux-deb, build-arch, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Build a flat list of every asset artifact to attach to the release.
          mapfile -t ASSETS < <(find artifacts -type f)
          echo "Found ${#ASSETS[@]} asset(s):"
          for f in "${ASSETS[@]}"; do echo "  $f"; done
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Copper Download Manager $TAG" \
            --generate-notes

