<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #2d2d30;
      color: #fff;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header img {
      width: 32px;
      height: 32px;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.enabled {
      background: rgba(0, 180, 0, 0.2);
      border: 1px solid rgba(0, 180, 0, 0.4);
      color: #4cff4c;
    }
    .status.disabled {
      background: rgba(200, 0, 0, 0.2);
      border: 1px solid rgba(200, 0, 0, 0.4);
      color: #ff6b6b;
    }
    .toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .toggle-btn.enable {
      background: #28a745;
      color: white;
    }
    .toggle-btn.enable:hover {
      background: #34c759;
    }
    .toggle-btn.disable {
      background: #dc3545;
      color: white;
    }
    .toggle-btn.disable:hover {
      background: #e85d6a;
    }
    .open-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      background: #3a3a3c;
      color: white;
      transition: background 0.2s;
    }
    .open-btn:hover {
      background: #4a4a4c;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Copper">
    <h1>Copper Download Manager</h1>
  </div>
  <div id="status" class="status enabled">Interception: Enabled</div>
  <button id="toggleBtn" class="toggle-btn disable">Disable Interception</button>
  <button id="openBtn" class="open-btn">Open Copper</button>
  <script src="popup.js"></script>
</body>
</html>
