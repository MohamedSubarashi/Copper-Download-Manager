<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Copper icon">
    <div class="header-text">
      <h1>Copper Download Manager</h1>
      <span class="version">v0.3.5</span>
    </div>
    <span id="connDot" class="conn-dot disconnected" title="Copper status"></span>
  </div>

  <div id="status" class="status disabled">Copper not running</div>

  <div class="actions">
    <button id="openBtn" class="primary">Open Copper</button>
    <button id="pageBtn" class="secondary">Send current page</button>
  </div>

  <label class="section-label" for="urlInput">Quick download</label>
  <div class="url-input-row">
    <input type="text" id="urlInput" placeholder="Paste URL or magnet link" />
    <button id="sendBtn" class="send-btn">Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
